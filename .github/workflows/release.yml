name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux ${{ matrix.manylinux }} ${{ matrix.target }} py${{ matrix.python.version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python:
          - version: "3.10"
            tag: cp310
          - version: "3.11"
            tag: cp311
          - version: "3.12"
            tag: cp312
          - version: "3.13"
            tag: cp313
        target: [x86_64, x86, aarch64, armv7, s390x, ppc64le]
        manylinux: [auto]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python.version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --interpreter python${{ matrix.python.version }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.manylinux }}-${{ matrix.target }}-${{ matrix.python.tag }}
          path: dist
          if-no-files-found: error

  musllinux:
    name: Linux musllinux ${{ matrix.target }} py${{ matrix.python.version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python:
          - version: "3.10"
            tag: cp310
          - version: "3.11"
            tag: cp311
          - version: "3.12"
            tag: cp312
          - version: "3.13"
            tag: cp313
        target: [x86_64, x86, aarch64, armv7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python.version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: musllinux_1_2
          args: --release --out dist --interpreter python${{ matrix.python.version }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}-${{ matrix.python.tag }}
          path: dist
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.target }} py${{ matrix.python.version }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x64
            python:
              architecture: x64
              version: "3.10"
              tag: cp310
          - runner: windows-latest
            target: x64
            python:
              architecture: x64
              version: "3.11"
              tag: cp311
          - runner: windows-latest
            target: x64
            python:
              architecture: x64
              version: "3.12"
              tag: cp312
          - runner: windows-latest
            target: x64
            python:
              architecture: x64
              version: "3.13"
              tag: cp313
          - runner: windows-latest
            target: x86
            python:
              architecture: x86
              version: "3.10"
              tag: cp310
          - runner: windows-latest
            target: x86
            python:
              architecture: x86
              version: "3.11"
              tag: cp311
          - runner: windows-latest
            target: x86
            python:
              architecture: x86
              version: "3.12"
              tag: cp312
          - runner: windows-latest
            target: x86
            python:
              architecture: x86
              version: "3.13"
              tag: cp313
          - runner: windows-11-arm
            target: aarch64
            python:
              architecture: arm64
              version: "3.11"
              tag: cp311
          - runner: windows-11-arm
            target: aarch64
            python:
              architecture: arm64
              version: "3.12"
              tag: cp312
          - runner: windows-11-arm
            target: aarch64
            python:
              architecture: arm64
              version: "3.13"
              tag: cp313
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python.version }}
          architecture: ${{ matrix.python.architecture }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}-${{ matrix.python.tag }}
          path: dist
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.platform.target }} py${{ matrix.python.version }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python:
          - version: "3.10"
            tag: cp310
          - version: "3.11"
            tag: cp311
          - version: "3.12"
            tag: cp312
          - version: "3.13"
            tag: cp313
        platform:
          - runner: macos-13
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python.version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter python
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}-${{ matrix.python.tag }}
          path: dist
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [linux, musllinux, windows, macos, sdist]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v4
      - name: Publish distributions
        run: uv publish dist/*
